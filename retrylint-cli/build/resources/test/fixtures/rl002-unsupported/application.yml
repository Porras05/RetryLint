resilience4j:
  retry:
    instances:
      downstream:
        maxAttempts: 3
        waitDuration: 50ms
        enableExponentialBackoff: true
      downstream-supported:
        maxAttempts: 3
        waitDuration: 50ms
  timelimiter:
    instances:
      incoming:
        timeoutDuration: 800ms
      downstream:
        timeoutDuration: 400ms
      incoming-supported:
        timeoutDuration: 800ms
      downstream-supported:
        timeoutDuration: 400ms
