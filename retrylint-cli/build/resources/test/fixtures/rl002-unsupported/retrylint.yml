version: 1
name: rl002-unsupported
services:
  - id: service
    config: application.yml
operations:
  - id: service.a
    service: service
    idempotency: idempotent
  - id: service.b
    service: service
    idempotency: idempotent
  - id: service.c
    service: service
    idempotency: unknown
  - id: service.x
    service: service
    idempotency: idempotent
  - id: service.y
    service: service
    idempotency: idempotent
  - id: service.z
    service: service
    idempotency: idempotent
calls:
  - id: a-to-b
    from: service.a
    to: service.b
    timeLimiter: incoming
  - id: b-to-c
    from: service.b
    to: service.c
    retry: downstream
    timeLimiter: downstream
  - id: x-to-y
    from: service.x
    to: service.y
    timeLimiter: incoming-supported
  - id: y-to-z
    from: service.y
    to: service.z
    retry: downstream-supported
    timeLimiter: downstream-supported
analysis:
  roots: [service.a, service.x]
