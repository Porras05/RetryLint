version: 1
name: rl001-branching
services:
  - id: service
    config: application.yml
operations:
  - id: service.root
    service: service
    idempotency: idempotent
  - id: service.left
    service: service
    idempotency: idempotent
  - id: service.right
    service: service
    idempotency: idempotent
  - id: service.target
    service: service
    idempotency: idempotent
calls:
  - id: root-to-left
    from: service.root
    to: service.left
    retry: two-attempts
  - id: root-to-right
    from: service.root
    to: service.right
    retry: three-attempts
  - id: left-to-target
    from: service.left
    to: service.target
    retry: four-attempts
  - id: right-to-target
    from: service.right
    to: service.target
    retry: three-attempts
analysis:
  roots: [service.root]
  amplificationWarning: 9
  amplificationError: 27
  failOn: error
