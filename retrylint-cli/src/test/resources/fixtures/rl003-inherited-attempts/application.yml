# Attempt counts reach RL003 only through inheritance:
# inherits-default = 4 (configs.default), from-single = 1, explicit-two = 2.
resilience4j:
  retry:
    configs:
      default:
        maxAttempts: 4
        waitDuration: 10ms
      single:
        maxAttempts: 1
    instances:
      inherits-default:
        registerHealthIndicator: false
      from-single:
        baseConfig: single
      explicit-two:
        base-config: single
        max-attempts: 2
