version: 1
name: cyclic-topology
services:
  - id: service-a
    config: services/a/application.yml
  - id: service-b
    config: services/b/application.yml
  - id: service-c
    config: services/c/application.yml
operations:
  - id: service-a.call
    service: service-a
    idempotency: idempotent
  - id: service-b.call
    service: service-b
    idempotency: idempotent
  - id: service-c.call
    service: service-c
    idempotency: idempotent
calls:
  - id: a-to-b
    from: service-a.call
    to: service-b.call
  - id: b-to-c
    from: service-b.call
    to: service-c.call
  - id: c-to-a
    from: service-c.call
    to: service-a.call
analysis:
  roots: [service-a.call]
