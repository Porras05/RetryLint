version: 1
name: rl001-safe
services:
  - id: service
    config: application.yml
operations:
  - id: service.root
    service: service
    idempotency: idempotent
  - id: service.first
    service: service
    idempotency: idempotent
  - id: service.second
    service: service
    idempotency: idempotent
  - id: service.target
    service: service
    idempotency: idempotent
calls:
  - id: root-to-first
    from: service.root
    to: service.first
    retry: one-attempt
  - id: first-to-second
    from: service.first
    to: service.second
    retry: one-attempt
  - id: second-to-target
    from: service.second
    to: service.target
    retry: three-attempts
analysis:
  roots: [service.root]
  amplificationWarning: 9
  amplificationError: 27
  failOn: error
