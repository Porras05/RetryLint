name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Test and build (Java 21)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Temurin Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make the Gradle wrapper executable
        run: chmod +x gradlew

      - name: Run tests
        run: ./gradlew test --no-daemon

      - name: Build, verify coverage and package
        run: ./gradlew build --no-daemon

      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            retrylint-cli/build/reports/
            testbed-service/build/reports/
          if-no-files-found: ignore

      - name: Upload CLI distribution
        uses: actions/upload-artifact@v4
        with:
          name: retrylint-cli-distribution
          path: retrylint-cli/build/distributions/retrylint-cli-*.zip
